---
name: Testing

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  DEFAULT_PYTHON: "3.13"

jobs:
  pytest:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.14", "3.15"]
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1
      - name: 🏗 Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: 🏗 Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: 🏗 Install lxml build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxslt1-dev
      - name: 🏗 Install dependencies
        run: uv sync --python ${{ matrix.python }} --group dev
      - name: 🚀 Run pytest
        run: uv run --python ${{ matrix.python }} pytest --cov aiowebdav2 tests
      - name: ⬆️ Upload coverage artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-${{ matrix.python }}
          path: .coverage
          include-hidden-files: true

  coverage:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: ⬇️ Download coverage data
        uses: actions/download-artifact@v8.0.1
      - name: 🏗 Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: 🏗 Set up Python ${{ env.DEFAULT_PYTHON }}
        run: uv python install ${{ env.DEFAULT_PYTHON }}
      - name: 🏗 Install dependencies
        run: uv sync --group dev
      - name: 🚀 Process coverage results
        run: |
          uv run coverage combine coverage*/.coverage*
          uv run coverage xml -i
      - name: 🚀 Upload coverage report
        uses: codecov/codecov-action@v7.0.0
